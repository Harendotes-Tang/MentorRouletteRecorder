# 「报告校准有误」的自动回复 / Answer one report of a wrong calibration.
#
# Maintained in the MentorRecorder repository under tools/shared-calibration/public-repo/ and copied
# here by tools/shared-calibration/sync_public_repo.py.
#
# Security:
# * Only the event's numeric issue number is used; contents and immutable author identity come from
#   fresh REST snapshots. Issue text remains data. run contains no untrusted interpolation.
# * Reports persist bounded no-vote receipts and reconcile one bot reply, so contents:write is needed
#   and this workflow shares publication's lock. Ordinary text never revokes or quarantines a code.
# * Insufficient text reports wait automatically and link to structured evidence, without requiring
#   the maintainer to own that region's game. The scheduled evidence sweep catches missed events.
# * Every `uses:` is pinned to a commit id, with the release in the trailing comment. A tag can be
#   moved to another commit, so a mutable reference lets a third-party action change under a job
#   that holds this repository's token - and everything published here is downloaded by every
#   installed client. Dependabot still proposes upgrades, now as a reviewable commit bump.
# * Replies are reconciled by a bot-owned marker, including recovery after a successful POST whose
#   process ended before labelling. Labels do not grant vote eligibility.
name: report-calibration

on:
  issues:
    types: [opened, edited, labeled, reopened]

permissions:
  contents: write
  issues: write

defaults:
  run:
    shell: bash

jobs:
  report:
    name: Answer a report of a wrong calibration
    if: >-
      github.event.issue.state == 'open' &&
      contains(github.event.issue.labels.*.name, 'calibration-report') &&
      (github.event.action != 'labeled' || github.event.label.name == 'calibration-report')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: publish-calibration
      cancel-in-progress: false
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Validate the report, label it and reply once
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python -B tools/evidence_workflow.py --event "$GITHUB_EVENT_PATH"
