# Maintained in MentorRecorder and assembled with the canonical ref-sync tool by sync_public_repo.py.
# GITHUB_TOKEN publications do not trigger push workflows; workflow_run observes their completion.
name: mirror-repository

on:
  push:
  schedule:
    - cron: '11,41 * * * *'
  workflow_dispatch:
  workflow_run:
    workflows: [publish-calibration]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: gitcode-mirror-${{ github.repository }}
  cancel-in-progress: false

jobs:
  mirror:
    if: >-
      github.repository == 'Harendotes-Tang/MentorRecorder-Calibrations' &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Always execute trusted main, even when a different ref caused the event.
      - name: Check out trusted main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'
      - name: Synchronize public branches and tags
        env:
          GITCODE_MIRROR_TOKEN: ${{ secrets.GITCODE_MIRROR_TOKEN }}
        run: python tools/sync_refs.py --repo MentorRecorder-Calibrations
