# Issue text is data. Fixed commands only; all mutations share the publication lock.
name: evidence-calibration
on:
  issues:
    types: [opened, edited, labeled, reopened]
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
permissions:
  contents: write
  issues: write
defaults:
  run:
    shell: bash
jobs:
  evidence:
    if: >-
      github.event_name != 'issues' ||
      (github.event.issue.state == 'open' &&
       (contains(github.event.issue.labels.*.name, 'calibration-evidence') ||
        contains(github.event.issue.labels.*.name, 'template-observation')))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: publish-calibration
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Process one fresh Issue
        if: github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python -B tools/evidence_workflow.py --event "$GITHUB_EVENT_PATH"
      - name: Sweep open evidence and legacy text reports
        if: github.event_name != 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python -B tools/evidence_workflow.py --sweep
