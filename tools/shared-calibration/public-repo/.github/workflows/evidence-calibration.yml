# Issue text is data. Fixed commands only. Evidence and report jobs share their own lock, never publication's:
# their Issues can stay open and start a job on every edit, and in publication's group a stream of edits would
# keep cancelling the queued publish job and its sweep. A refused push is redone from the new main.
name: evidence-calibration
on:
  issues:
    types: [opened, edited, labeled, reopened]
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
permissions:
  contents: write
  issues: write
defaults:
  run:
    shell: bash
jobs:
  evidence:
    if: >-
      github.event_name != 'issues' ||
      (github.event.issue.state == 'open' &&
       (contains(github.event.issue.labels.*.name, 'calibration-evidence') ||
        contains(github.event.issue.labels.*.name, 'template-observation')))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: evidence-intake
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Process one fresh Issue
        if: github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python -B tools/evidence_workflow.py --event "$GITHUB_EVENT_PATH"
      - name: Sweep open evidence and legacy text reports
        if: github.event_name != 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python -B tools/evidence_workflow.py --sweep
