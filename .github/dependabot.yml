# Dependency update proposals. Security advisories are handled by Dependabot security updates
# (repository setting); this file only adds the monthly version bumps for the ecosystems the
# build depends on. Qt and MinGW come from the toolchain, not from a package registry.
version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
  # The workflows pin every action to a commit id; Dependabot reads those pins and proposes the
  # upgrade as a commit bump, so pinning costs nothing in maintenance.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
  # tools/requirements-ci.txt: the two packages CI installs for the signature tool's tests. Named
  # inline in a `pip install` line they were tracked by nothing at all.
  - package-ecosystem: "pip"
    directory: "/tools"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
