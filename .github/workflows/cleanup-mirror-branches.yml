name: Clean approved GitCode mirror branches

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cleanup-mirror-branches.yml'
      - 'tools/release-mirror/cleanup_refs.py'
      - 'tools/release-mirror/test_cleanup_refs.py'
      - 'tools/release-mirror/cleanup-plan.json'
      - 'tools/release-mirror/sync_refs.py'
  delete:
  schedule:
    - cron: '43 */6 * * *'

permissions:
  contents: read

# The publisher and normal repository mirror use the same repository-scoped lock.
concurrency:
  group: gitcode-mirror-${{ github.repository }}
  cancel-in-progress: false

jobs:
  cleanup:
    if: github.repository == 'Harendotes-Tang/MentorRouletteRecorder' && (github.event_name != 'delete' || github.event.ref_type == 'branch')
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'
      - name: Test approved cleanup safety boundaries
        run: python tools/release-mirror/test_cleanup_refs.py
      - name: Preview both repositories before any deletion
        timeout-minutes: 30
        shell: bash
        run: |
          set -euo pipefail
          python tools/release-mirror/cleanup_refs.py --repo MentorRouletteRecorder
          python tools/release-mirror/cleanup_refs.py --repo MentorRecorder-Calibrations
      - name: Recheck and execute approved cleanup
        timeout-minutes: 30
        env:
          GITCODE_MIRROR_TOKEN: ${{ secrets.GITCODE_MIRROR_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          python tools/release-mirror/cleanup_refs.py --repo MentorRouletteRecorder --execute
          python tools/release-mirror/cleanup_refs.py --repo MentorRecorder-Calibrations --execute
